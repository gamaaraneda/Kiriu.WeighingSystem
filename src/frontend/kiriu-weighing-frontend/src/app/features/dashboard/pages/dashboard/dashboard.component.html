<div class="dashboard-container">
  <!-- Header -->
  <app-header
    (queriesClick)="onQueries()"
    [showAdminButton]="canAccessAdmin()"
    (adminClick)="onAdmin()"
    (logoutClick)="onLogout()"
  ></app-header>

  <!-- Contenido principal -->
  <main class="dashboard-content">
    <div class="container">
      <!-- Breadcrumb -->
      <app-breadcrumb></app-breadcrumb>

      <!-- Título y subtítulo -->
      <div class="dashboard-header">
        <h1 class="dashboard-title">¿Qué tipo de unidad estás registrando?</h1>
        <p class="dashboard-subtitle">
          Selecciona el tipo de unidad para continuar con el registro
        </p>
      </div>

      <!-- Tarjetas de selección -->
      <div class="cards-container">
        <div class="grid grid-2">
          <app-card-selector
            *ngFor="let unitType of unitTypes"
            [card]="unitType"
            (cardSelected)="onUnitTypeSelected($event)"
          ></app-card-selector>
        </div>
      </div>
    </div>
  </main>
</div>
