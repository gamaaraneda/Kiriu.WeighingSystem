<header class="topbar" role="banner">
  <div class="brand">
    <strong class="logo">KIRIU</strong>
    <span class="app">Sistema de Pesaje</span>
  </div>
  <div class="spacer"></div>

  <div class="topbar-actions">
    <button class="btn-menu" aria-label="Ir a Consultas" *ngIf="showQueriesButton" (click)="onQueriesClick()">Consultas</button>
    <button class="btn-menu" aria-label="Ir a Administración" *ngIf="shouldShowAdminButton" (click)="onAdminClick()">Administración</button>

    <div class="user-info" *ngIf="currentUser">
      <span class="user-icon">👤</span>
      <div class="user-details">
        <span class="user-email">{{ currentUser.email }}</span>
        <span class="user-role">{{ currentUser.rol }}</span>
      </div>
      <button class="btn-logout" aria-label="Cerrar sesión" *ngIf="showLogoutButton" (click)="onLogoutClick()">
        <span class="logout-icon">🚪</span>
        <span class="logout-text">Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>
