<div class="login-container">
  <div class="login-card fade-in">
    <!-- Logo y título -->
    <div class="login-header">
      <div class="logo">
        <span class="logo-text">KIRIU</span>
      </div>
      <h1 class="login-title">Sistema de Pesaje</h1>
      <p class="login-subtitle">
        Ingresa tus credenciales para acceder al sistema
      </p>
    </div>

    <!-- Formulario de login -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Campo Usuario -->
      <div class="form-group">
        <label for="username" class="form-label">Usuario</label>
        <input
          type="text"
          id="username"
          formControlName="username"
          class="form-input"
          [class.error]="hasError('username')"
          placeholder="Ingresa tu usuario"
          [disabled]="isLoading"
        />
        <div *ngIf="hasError('username')" class="error-message">
          {{ getErrorMessage("username") }}
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-input"
          [class.error]="hasError('password')"
          placeholder="Ingresa tu contraseña"
          [disabled]="isLoading"
        />
        <div *ngIf="hasError('password')" class="error-message">
          {{ getErrorMessage("password") }}
        </div>
      </div>

      <!-- Mensaje de error general -->
      <div *ngIf="errorMessage" class="error-message-general">
        {{ errorMessage }}
      </div>

      <!-- Botón de login -->
      <button
        type="submit"
        class="btn w-100"
        [class.btn-loading]="isLoading"
        [disabled]="isLoading || loginForm.invalid"
      >
        <span *ngIf="!isLoading">Iniciar sesión</span>
        <span *ngIf="isLoading">Iniciando sesión...</span>
      </button>
    </form>

    <!-- Texto de ayuda -->
    <div class="help-text">
      <p>
        Usuario de prueba: <strong>admin</strong> | Contraseña:
        <strong>admin123</strong>
      </p>
    </div>
  </div>
</div>
