<header class="topbar" role="banner">
  <div class="brand">
    <img src="ico/logo.png" alt="KIRIU" class="logo" />
    <span class="app">Sistema de Pesaje</span>
  </div>

  <!-- Menú de navegación central -->
  <nav class="main-nav" role="navigation">
    <button
      class="nav-item"
      aria-label="Ir a Consultas"
      *ngIf="showQueriesButton"
      (click)="onQueriesClick()"
    >
      <span class="nav-icon">📊</span>
      <span class="nav-label">Consultas</span>
    </button>
    <button
      class="nav-item"
      aria-label="Ir a Administración"
      *ngIf="showAdminButton"
      (click)="onAdminClick()"
    >
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Administración</span>
    </button>
  </nav>

  <!-- Área de usuario -->
  <div class="user-area">
    <div class="user-info" *ngIf="currentUser">
      <span class="user-icon">👤</span>
      <div class="user-details">
        <span class="user-email">{{ currentUser.email }}</span>
        <span class="user-role">{{ currentUser.rol }}</span>
      </div>
      <button
        class="btn-logout"
        aria-label="Cerrar sesión"
        *ngIf="showLogoutButton"
        (click)="onLogoutClick()"
      >
        <span class="logout-icon">🚪</span>
        <span class="logout-text">Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>
