<div class="process-steps-container" *ngIf="processFlow">
  <!-- Título del flujo -->
  <div class="flow-header">
    <h3 class="flow-title">{{ processFlow.title }}</h3>
    <div class="progress-indicator" *ngIf="showProgress">
      <div class="progress-bar">
        <div
          class="progress-fill"
          [style.width.%]="getProgressPercentage()"
        ></div>
      </div>
      <span class="progress-text"
        >{{ getCompletedStepsCount() }}/{{ getTotalStepsCount() }}</span
      >
      <button
        type="button"
        class="collapse-toggle-btn"
        (click)="toggleCollapse()"
        [title]="isCollapsed ? 'Expandir pasos' : 'Colapsar pasos'"
      >
        <i class="pi" [class.pi-chevron-down]="isCollapsed" [class.pi-chevron-up]="!isCollapsed"></i>
      </button>
    </div>
  </div>

  <!-- Lista de pasos -->
  <div class="steps-list" [class.collapsed]="isCollapsed">
    <div
      *ngFor="let step of processFlow.steps; trackBy: trackByStepId"
      class="step-item"
      [class.completed]="step.isCompleted"
      [class.current]="step.id === currentStep"
    >
      <div class="step-icon">
        <span *ngIf="step.isCompleted" class="step-status completed">✅</span>
        <span *ngIf="!step.isCompleted" class="step-status pending">⏳</span>
        <span class="step-icon-main">{{ step.icon }}</span>
      </div>

      <div class="step-content">
        <div class="step-label">
          {{ step.label }}
          <span *ngIf="step.isRequired" class="required-indicator">*</span>
        </div>

        <div class="step-status-text">
          <span *ngIf="step.isCompleted" class="status-completed"
            >Completado</span
          >
          <span *ngIf="!step.isCompleted" class="status-pending"
            >Pendiente</span
          >
        </div>
      </div>
    </div>
  </div>
</div>
